version: '3.8'

services:
  pickmybuild-storefront:
    image: node:20-alpine
    container_name: pickmybuild-storefront
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8788:8788"
    command: sh -c "npm install && npx wrangler pages dev public --ip 0.0.0.0 --port 8788"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
